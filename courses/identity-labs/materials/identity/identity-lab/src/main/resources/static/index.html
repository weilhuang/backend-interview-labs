<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C15 合成身份订单实验</title><link rel="stylesheet" href="/style.css"><main><h1>一枚 token 能做什么？</h1><p>先验证身份，再检查订单归属与角色。此页由课程提供，不要求编写前端。</p><aside>仅用于本地合成实验。当前不是 SSO 登录页，不要输入工作账号的真实 token。凭证只留在页面内存，不写浏览器存储或日志。</aside><label for="token">本地合成 access token</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="load">暂存到本页内存</button><button id="clear">清除凭证</button><section><h2>绕过按钮也必须安全</h2><p>所有按钮都可点击。真正的权限由服务器判断。</p><button data-method="GET" data-path="/api/orders/order-a">读 tenant-a 订单</button><button data-method="POST" data-path="/api/orders/order-a/approve">审批 tenant-a 订单</button><button data-method="GET" data-path="/api/orders/order-b">尝试读 tenant-b 订单</button></section><output id="result" aria-live="polite">等待操作。没有 token 请求应返回 401。</output><p>401：凭证未被接受；403：身份可信但本次操作无权限。请勿把凭证粘贴到截图或故障记录。</p></main><script src="/app.js"></script></html>
