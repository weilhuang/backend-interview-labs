# 所有镜像从仓库唯一的 infra/versions.env 注入，不在这里复制版本。
services:
  mysql:
    image: ${MYSQL_IMAGE:?缺少共享MYSQL_IMAGE}
    environment:
      MYSQL_DATABASE: capstone
      MYSQL_USER: lab
      MYSQL_PASSWORD: lab_only_password
      MYSQL_ROOT_PASSWORD: root_only_lab_password
    command: ["--innodb-flush-log-at-trx-commit=1", "--sync-binlog=1"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql -ulab -plab_only_password -e 'SELECT 1' capstone >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  redis:
    image: ${REDIS_IMAGE:?缺少共享REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 15
  kafka:
    image: ${KAFKA_IMAGE:?缺少共享KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
  delivery:
    image: ${JAVA_BUILD_IMAGE:?缺少共享JAVA_BUILD_IMAGE}
    entrypoint: ["java", "-Xmx256m", "-Dio.netty.eventLoopThreads=2", "-cp", "/opt/app/lib/*", "labs.capstone.DeliveryMain"]
    environment: &app_env
      LAB_JDBC: jdbc:mysql://mysql:3306/capstone
      LAB_DB_USER: lab
      LAB_DB_PASSWORD: lab_only_password
      LAB_REDIS_HOST: redis
      LAB_REDIS_PORT: 6379
      LAB_KAFKA: kafka:9092
      LAB_RPC_HOST: delivery
      LAB_RPC_PORT: 9090
    volumes: ["./capstone/stages/${CAPSTONE_STAGE:-05-defense}/build/install/${CAPSTONE_STAGE:-05-defense}:/opt/app:ro"]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "java", "-Xmx64m", "-cp", "/opt/app/lib/*", "labs.capstone.HealthMain", "rpc"]
      interval: 10s
      timeout: 8s
      retries: 12
  orders:
    image: ${JAVA_BUILD_IMAGE:?缺少共享JAVA_BUILD_IMAGE}
    entrypoint: ["java", "-Xmx384m", "-Dio.netty.eventLoopThreads=2", "-cp", "/opt/app/lib/*", "labs.capstone.BootApp"]
    environment: *app_env
    volumes: ["./capstone/stages/${CAPSTONE_STAGE:-05-defense}/build/install/${CAPSTONE_STAGE:-05-defense}:/opt/app:ro"]
    ports: ["127.0.0.1:${CAPSTONE_HTTP_PORT:-8088}:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      delivery: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "java", "-Xmx64m", "-cp", "/opt/app/lib/*", "labs.capstone.HealthMain"]
      interval: 10s
      timeout: 8s
      retries: 12
volumes:
  mysql_data:
  redis_data:
  kafka_data:
