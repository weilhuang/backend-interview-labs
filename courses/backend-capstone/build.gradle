plugins { id 'base' }
allprojects {
    group = 'dev.backend.capstone'
    version = rootProject.property('courseVersion')
    repositories {
        if (System.getenv('LAB_MAVEN_REPOSITORY')) {
            maven { url = uri(System.getenv('LAB_MAVEN_REPOSITORY')); allowInsecureProtocol = System.getenv('LAB_MAVEN_REPOSITORY').startsWith('http://127.0.0.1:'); metadataSources { gradleMetadata(); mavenPom(); artifact() } }
        } else { mavenCentral() }
    }
}
def targets = ['01-contract':'OrderRules','02-reliability':'OrderService','03-delivery':'DeliveryFlow','04-recovery':'RecoveryPolicy','05-defense':'Audit']
subprojects {
    apply plugin: 'application'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    application { mainClass = 'labs.capstone.BootApp' }
    // Separate roots keep Gradle compilation and IDEA indexing in agreement.
    // Each stage uses its editable class plus the other four completed classes.
    def referenceSourceDirs = targets.keySet().findAll { it != project.name }
        .collect { rootProject.file("reference/${it}/src") }
    sourceSets {
        main {
            java.srcDirs = ['src', rootProject.file('app/src/main/java')] + referenceSourceDirs
            resources.srcDirs = [rootProject.file('app/src/main/resources')]
        }
        test { java.srcDirs = ['test', rootProject.file('shared/test')] }
        integrationTest { java.srcDirs = ['integration-test', rootProject.file('shared/integration-test')]; compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output }
    }
    configurations { integrationTestImplementation.extendsFrom testImplementation; integrationTestRuntimeOnly.extendsFrom testRuntimeOnly }
    dependencies {
        implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation('com.mysql:mysql-connector-j:9.2.0') { version { strictly '9.2.0' } }
        implementation('org.apache.kafka:kafka-clients:3.9.1') { version { strictly '3.9.1' } }
        implementation('redis.clients:jedis:5.2.0') { version { strictly '5.2.0' } }
        implementation 'io.grpc:grpc-netty-shaded:1.71.0'
        implementation 'io.grpc:grpc-protobuf:1.71.0'
        implementation 'io.grpc:grpc-stub:1.71.0'
        implementation('com.google.protobuf:protobuf-java:4.29.0') { version { strictly '4.29.0' } }
        compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testRuntimeOnly 'org.apiguardian:apiguardian-api:1.1.2'
        testRuntimeOnly 'com.h2database:h2:2.3.232'
        testImplementation enforcedPlatform('org.testcontainers:testcontainers-bom:1.20.6')
        testImplementation 'org.testcontainers:mysql'
        testImplementation 'org.testcontainers:kafka'
        testImplementation 'org.testcontainers:junit-jupiter'
    }
    tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8'; options.compilerArgs += '-parameters' }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '512m'; maxParallelForks = 1
        if (!debug) timeout = java.time.Duration.ofMinutes(12)
        systemProperty 'junit.jupiter.execution.timeout.default', name == 'integrationTest' ? '360 s' : '90 s'
        systemProperty 'junit.jupiter.execution.timeout.mode', 'disabled_on_debug'
        systemProperty 'io.netty.eventLoopThreads', '2'
        outputs.upToDateWhen { false }
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        afterTest { descriptor, result ->
            if (result.resultType == TestResult.ResultType.FAILURE) {
                def lines = (result.exception?.message ?: '检查失败').split('\n', -1)
                println "#educational_plugin FAILED + ${lines[0]}"
                lines.drop(1).each { println "#educational_plugin${it}" }
                println ''
            }
        }
    }
    tasks.register('integrationTest', Test) {
        description = '真实MySQL、Redis、Kafka与gRPC，不具备Docker时失败而不跳过'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        def versions = rootProject.file(System.getenv('LAB_SHARED_VERSIONS') ?: '../../infra/versions.env')
        if (!versions.isFile() && !System.getenv('LAB_SHARED_VERSIONS')) versions = rootProject.file('shared/versions.env')
        systemProperty 'lab.versions', versions.absolutePath
        if (project.hasProperty('dockerApiVersion')) systemProperty 'api.version', project.property('dockerApiVersion')
        doFirst {
            Properties images = new Properties()
            versions.withInputStream { images.load(it) }
            environment 'TESTCONTAINERS_RYUK_CONTAINER_IMAGE', images.getProperty('TESTCONTAINERS_RYUK_IMAGE')
            environment 'TESTCONTAINERS_TINYIMAGE_CONTAINER_IMAGE', images.getProperty('TESTCONTAINERS_TINY_IMAGE')
        }
    }
    tasks.named('run', JavaExec) { mainClass = 'labs.capstone.Usage' }
    tasks.register('runServer', JavaExec) { dependsOn classes; classpath = sourceSets.main.runtimeClasspath; mainClass = 'labs.capstone.BootApp' }
    tasks.register('usage', JavaExec) { dependsOn classes; classpath = sourceSets.main.runtimeClasspath; mainClass = 'labs.capstone.Usage' }
    dependencyLocking { lockAllConfigurations() }
    tasks.register('verificationClasspath') { dependsOn testClasses, integrationTestClasses; doLast { file("${buildDir}/test-classpath.txt").text = sourceSets.test.runtimeClasspath.asPath; file("${buildDir}/integration-classpath.txt").text = sourceSets.integrationTest.runtimeClasspath.asPath } }
}
tasks.register('test') { dependsOn subprojects.collect { it.tasks.named('test') } }
tasks.register('integrationTest') { dependsOn subprojects.collect { it.tasks.named('integrationTest') } }
tasks.named('check') { dependsOn tasks.named('test') }
