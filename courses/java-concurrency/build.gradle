import java.time.Duration
import org.gradle.api.tasks.testing.TestResult
plugins { id 'base' }
allprojects {
    group = 'dev.weil.backendlabs'
    version = '0.1.0'
    repositories { mavenCentral() }
}
subprojects {
    apply plugin: 'java'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    sourceSets {
        main { java.setSrcDirs(['src']) }
        test { java.setSrcDirs(['test']) }
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxHeapSize = '128m'
        maxParallelForks = 1
        if (!project.hasProperty('debugLab')) timeout = Duration.ofSeconds(45)
        systemProperty 'junit.jupiter.execution.timeout.mode', 'disabled_on_debug'
        outputs.upToDateWhen { false }
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        // 与官方Academy模板一致的失败输出协议。
        afterTest { descriptor, result ->
            if (result.resultType == TestResult.ResultType.FAILURE) {
                def lines = (result.exception?.message ?: '答案未满足契约').split('\n', -1)
                println "#educational_plugin FAILED + ${lines[0]}"
                lines.drop(1).each { println "#educational_plugin${it}" }
                println ''
            }
        }
    }
    tasks.register('run', JavaExec) {
        dependsOn classes
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'labs.' + file('src/labs').listFiles().find { it.name.endsWith('Usage.java') }.name.replace('.java','')
        maxHeapSize = '128m'
        timeout = Duration.ofSeconds(15)
    }
}
tasks.register('test') { dependsOn subprojects.collect { it.tasks.named('test') } }
tasks.named('check') { dependsOn tasks.named('test') }
tasks.named('wrapper') { gradleVersion = '8.10.2' }
