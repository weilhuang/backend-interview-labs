plugins { id 'base' }
allprojects {
    group = 'dev.backend.distributed'
    version = '0.2.0'
    repositories {
        if (System.getenv('LAB_MAVEN_REPOSITORY')) {
            maven {
                url = uri(System.getenv('LAB_MAVEN_REPOSITORY'))
                allowInsecureProtocol = System.getenv('LAB_MAVEN_REPOSITORY').startsWith('http://127.0.0.1:')
                // 与 Maven Central 一样尊重官方 .module 重定向，不能用 POM-only 图制作锁。
                metadataSources { gradleMetadata(); mavenPom(); artifact() }
            }
        } else { mavenCentral() }
    }
}
subprojects {
    apply plugin: 'java-library'
    // Academy Check 调用模块 test；这两节的真实服务练习区必须同时参与判题。
    def realGradingModule = project.name in ['06-transactions', '07-outbox-cache']
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    sourceSets {
        main { java.setSrcDirs(['src']); resources.setSrcDirs(['resources']) }
        test { java.setSrcDirs(['test']) }
        integrationTest {
            java.setSrcDirs(['integration-test'])
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations {
        integrationTestImplementation.extendsFrom testImplementation
        integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // 官方 JUnit .module 将注解依赖区分为编译期，显式声明保证运行类路径锁一致。
        testRuntimeOnly 'org.apiguardian:apiguardian-api:1.1.2'
        testRuntimeOnly 'com.h2database:h2:2.3.232'
        if (name != 'support') api project(':support')
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs += ['-parameters', '-Xlint:all,-processing,-serial', '-Werror']
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'io.netty.eventLoopThreads', '2'
        systemProperty 'zookeeper.nio.numSelectorThreads', '1'
        systemProperty 'zookeeper.nio.numWorkerThreads', '2'
        maxHeapSize = '512m'
        maxParallelForks = 1
        timeout = java.time.Duration.ofMinutes(10)
        def versions = rootProject.file('shared/versions.env')
        if (!versions.exists()) versions = rootProject.file('../../infra/versions.env')
        systemProperty 'lab.versions', versions.absolutePath
        if (project.hasProperty('dockerApiVersion')) {
            systemProperty 'api.version', project.property('dockerApiVersion')
        }
        if (name == 'integrationTest' || (name == 'test' && realGradingModule)) {
            Properties images = new Properties()
            if (!versions.isFile()) throw new GradleException('缺少共享镜像台账：' + versions)
            versions.withInputStream { images.load(it) }
            [TESTCONTAINERS_RYUK_IMAGE: 'TESTCONTAINERS_RYUK_CONTAINER_IMAGE',
             TESTCONTAINERS_TINY_IMAGE: 'TESTCONTAINERS_TINYIMAGE_CONTAINER_IMAGE'].each { key, variable ->
                String image = images.getProperty(key)
                if (!image) throw new GradleException('共享台账缺少辅助镜像键：' + key)
                environment variable, image
            }
        }
        outputs.upToDateWhen { false }
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        afterTest { descriptor, result ->
            if (result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.FAILURE) {
                def lines = (result.exception?.message ?: '检查失败').split('\n', -1)
                println "#educational_plugin FAILED + ${lines[0]}"
                lines.drop(1).each { println "#educational_plugin${it}" }
                println ''
            }
        }
    }
    tasks.register('unitTest', Test) {
        description = '不依赖Docker的局部合同快测；不能代替06/07完整Check或真实服务验收'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
    }
    if (realGradingModule) tasks.named('test', Test) {
        description = 'Academy完整判题：合同与真实服务一起执行；Docker不可用即失败'
        dependsOn tasks.named('integrationTestClasses')
        testClassesDirs = sourceSets.test.output.classesDirs + sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath + sourceSets.integrationTest.runtimeClasspath
    }
    tasks.register('integrationTest', Test) {
        description = '必须在有Docker的隔离环境执行真实服务，缺失即失败，不静默跳过'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
    }
    tasks.register('verificationClasspath') {
        dependsOn testClasses, integrationTestClasses
        doLast {
            // 无集成源码的模块也解析全部六种类路径，避免 CI 后续新增入口才暴露锁缺失。
            ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath',
             'integrationTestCompileClasspath', 'integrationTestRuntimeClasspath'].each { configuration ->
                configurations.getByName(configuration).resolve()
            }
            file("${buildDir}/main-classpath.txt").text = sourceSets.main.runtimeClasspath.asPath
            file("${buildDir}/test-classpath.txt").text = sourceSets.test.runtimeClasspath.asPath
            file("${buildDir}/integration-classpath.txt").text = sourceSets.integrationTest.runtimeClasspath.asPath
        }
    }
    if (name != 'support') tasks.register('run', JavaExec) {
        dependsOn classes
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'labs.distributed.Usage'
        if (project.hasProperty('appArgs')) args project.property('appArgs').split(' ')
        def versionsFile = rootProject.file('shared/versions.env')
        if (!versionsFile.exists()) versionsFile = rootProject.file('../../infra/versions.env')
        systemProperty 'lab.versions', versionsFile.absolutePath
        systemProperty 'io.netty.eventLoopThreads', '2'
    }
    dependencyLocking { lockAllConfigurations() }
}
project(':support') {
    dependencies {
        api 'com.mysql:mysql-connector-j:9.2.0'
        api 'org.testcontainers:mysql:1.20.6'
        api 'org.testcontainers:kafka:1.20.6'
        runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    }
}
project(':02-grpc') {
    dependencies {
        api 'io.grpc:grpc-netty-shaded:1.71.0'
        api 'io.grpc:grpc-protobuf:1.71.0'
        api 'io.grpc:grpc-stub:1.71.0'
        api 'com.google.protobuf:protobuf-java:4.29.0'
        compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    }
}
project(':03-dubbo') {
    dependencies {
        api 'org.apache.dubbo:dubbo:3.3.6'
        implementation 'org.apache.dubbo:dubbo-registry-zookeeper:3.3.6'
        implementation 'org.apache.dubbo:dubbo-remoting-zookeeper-curator5:3.3.6'
        testImplementation 'org.apache.curator:curator-test:5.7.1'
    }
}
project(':04-resilience') {
    dependencies {
        implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.3.0'
        implementation 'io.github.resilience4j:resilience4j-bulkhead:2.3.0'
        implementation 'io.github.resilience4j:resilience4j-ratelimiter:2.3.0'
    }
}
project(':07-outbox-cache') {
    dependencies {
        implementation 'org.apache.kafka:kafka-clients:3.9.1'
        implementation 'redis.clients:jedis:5.2.0'
    }
}
project(':08-capacity') {
    dependencies {
        implementation project(':02-grpc')
        implementation project(':03-dubbo')
        implementation project(':05-idempotency')
    }
}
tasks.register('unitTest') { dependsOn subprojects.collect { it.tasks.named('unitTest') } }
tasks.register('test') { dependsOn subprojects.collect { it.tasks.named('test') } }
tasks.register('integrationTest') { dependsOn subprojects.collect { it.tasks.named('integrationTest') } }
tasks.named('check') { dependsOn tasks.named('test') }
