plugins { id 'base' }
allprojects {
    group = 'dev.backend.messaging'
    version = '0.2.0'
    repositories {
        if (System.getenv('LAB_MAVEN_REPOSITORY')) {
            maven { url = uri(System.getenv('LAB_MAVEN_REPOSITORY')); allowInsecureProtocol = System.getenv('LAB_MAVEN_REPOSITORY').startsWith('http://127.0.0.1:') }
        } else { mavenCentral() }
    }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    sourceSets {
        main { java.setSrcDirs(['src']) }
        test { java.setSrcDirs(['test']) }
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:5.11.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // 明确保留注解API，令官方POM离线验证与Gradle模块元数据的运行类路径锁一致。
        testRuntimeOnly 'org.apiguardian:apiguardian-api:1.1.2'
        testRuntimeOnly 'com.h2database:h2:2.3.232'
        if (name != 'support') implementation project(':support')
    }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Test).configureEach {
        useJUnitPlatform { if (!project.hasProperty('withDocker')) excludeTags 'docker' }
        maxHeapSize = '512m'; maxParallelForks = 1
        timeout = java.time.Duration.ofMinutes(12)
        def versionsFile = rootProject.file('shared/versions.env')
        if (!versionsFile.exists()) versionsFile = rootProject.file('../../infra/versions.env')
        systemProperty 'lab.versions', versionsFile.absolutePath
        if (project.hasProperty('withDocker')) {
            Properties images = new Properties()
            if (!versionsFile.isFile()) throw new GradleException('缺少共享镜像台账：' + versionsFile)
            versionsFile.withInputStream { images.load(it) }
            [TESTCONTAINERS_RYUK_IMAGE: 'TESTCONTAINERS_RYUK_CONTAINER_IMAGE',
             TESTCONTAINERS_TINY_IMAGE: 'TESTCONTAINERS_TINYIMAGE_CONTAINER_IMAGE'].each { key, variable ->
                String image = images.getProperty(key)
                if (!image) throw new GradleException('共享镜像台账缺少Testcontainers辅助镜像键：' + key)
                environment variable, image
            }
        }
        if (project.hasProperty('dockerApiVersion')) {
            systemProperty 'api.version', project.property('dockerApiVersion')
        }
        outputs.upToDateWhen { false }
        testLogging { events 'failed', 'skipped'; exceptionFormat 'full' }
        afterTest { descriptor, result ->
            if (result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.FAILURE) {
                def lines = (result.exception?.message ?: '检查失败').split('\n', -1)
                println "#educational_plugin FAILED + ${lines[0]}"
                lines.drop(1).each { println "#educational_plugin${it}" }
                println ''
            }
        }
    }
    dependencyLocking { lockAllConfigurations() }
    if (name != 'support') tasks.register('run', JavaExec) {
        dependsOn classes; classpath = sourceSets.main.runtimeClasspath
        mainClass = 'labs.messaging.Usage'
        if (project.hasProperty('appArgs')) args project.property('appArgs').split(' ')
    }
}
project(':support') {
    dependencies {
        api 'org.apache.kafka:kafka-clients:3.9.1'
        api 'org.apache.rocketmq:rocketmq-client-java:5.0.8'
        api 'org.testcontainers:kafka:1.20.6'
        api 'org.testcontainers:mysql:1.20.6'
        api 'com.mysql:mysql-connector-j:9.2.0'
        runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    }
}
tasks.register('test') { dependsOn subprojects.collect { it.tasks.named('test') } }
tasks.named('check') { dependsOn tasks.named('test') }
