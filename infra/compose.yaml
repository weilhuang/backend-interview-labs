{
  "x-说明": "本文件使用 YAML 兼容的 JSON 语法，便于 Python 标准库离线校验；请勿复制镜像版本或开放公网端口。",
  "services": {
    "mysql": {
      "image": "${MYSQL_IMAGE}",
      "profiles": [
        "core",
        "mysql"
      ],
      "restart": "no",
      "mem_limit": "768m",
      "cpus": 1.0,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "networks": [
        "lab"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "ports": [
        "127.0.0.1:${MYSQL_PORT}:3306"
      ],
      "environment": {
        "MYSQL_DATABASE": "${MYSQL_DATABASE}",
        "MYSQL_USER": "${MYSQL_USER}",
        "MYSQL_PASSWORD": "${MYSQL_PASSWORD}",
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD}"
      },
      "command": [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci",
        "--innodb-buffer-pool-size=128M",
        "--max-connections=60"
      ],
      "volumes": [
        "mysql-data:/var/lib/mysql"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --batch --skip-column-names -e \"SELECT 1\" | grep -qx 1"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "40s"
      }
    },
    "redis": {
      "image": "${REDIS_IMAGE}",
      "profiles": [
        "core",
        "redis"
      ],
      "restart": "no",
      "mem_limit": "192m",
      "cpus": 0.5,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "networks": [
        "lab"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "ports": [
        "127.0.0.1:${REDIS_PORT}:6379"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD}"
      },
      "command": [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "96mb",
        "--maxmemory-policy",
        "noeviction"
      ],
      "volumes": [
        "redis-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"
        ],
        "interval": "5s",
        "timeout": "3s",
        "retries": 12,
        "start_period": "5s"
      }
    },
    "kafka": {
      "image": "${KAFKA_IMAGE}",
      "profiles": [
        "kafka"
      ],
      "restart": "no",
      "mem_limit": "1024m",
      "cpus": 1.0,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "networks": [
        "lab"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "ports": [
        "127.0.0.1:${KAFKA_PORT}:19092"
      ],
      "environment": {
        "KAFKA_NODE_ID": "1",
        "KAFKA_PROCESS_ROLES": "broker,controller",
        "KAFKA_LISTENERS": "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092",
        "KAFKA_ADVERTISED_LISTENERS": "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT}",
        "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP": "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT",
        "KAFKA_INTER_BROKER_LISTENER_NAME": "INTERNAL",
        "KAFKA_CONTROLLER_LISTENER_NAMES": "CONTROLLER",
        "KAFKA_CONTROLLER_QUORUM_VOTERS": "1@kafka:9093",
        "KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR": "1",
        "KAFKA_TRANSACTION_STATE_LOG_MIN_ISR": "1",
        "KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS": "0",
        "KAFKA_AUTO_CREATE_TOPICS_ENABLE": "false",
        "KAFKA_LOG_DIRS": "/var/lib/kafka/data",
        "KAFKA_LOG_RETENTION_HOURS": "24",
        "KAFKA_LOG_RETENTION_BYTES": "134217728",
        "KAFKA_LOG_SEGMENT_BYTES": "33554432",
        "KAFKA_HEAP_OPTS": "-Xms256m -Xmx512m",
        "CLUSTER_ID": "MkU3OEVBNTcwNTJENDM2Qk"
      },
      "volumes": [
        "kafka-data:/var/lib/kafka/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
        ],
        "interval": "10s",
        "timeout": "10s",
        "retries": 12,
        "start_period": "30s"
      }
    },
    "java-build": {
      "image": "${JAVA_BUILD_IMAGE}",
      "profiles": [
        "tools"
      ],
      "restart": "no",
      "mem_limit": "1536m",
      "cpus": 2.0,
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "networks": [
        "lab"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "working_dir": "/workspace",
      "environment": {
        "GRADLE_USER_HOME": "/cache/gradle",
        "MAVEN_CONFIG": "/cache/maven",
        "MAVEN_OPTS": "-Dmaven.repo.local=/cache/maven/repository -Xmx768m",
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=60.0"
      },
      "volumes": [
        "../:/workspace",
        "maven-cache:/cache/maven",
        "gradle-cache:/cache/gradle"
      ],
      "entrypoint": [],
      "command": [
        "java",
        "-version"
      ]
    }
  },
  "networks": {
    "lab": {}
  },
  "volumes": {
    "mysql-data": {},
    "redis-data": {},
    "kafka-data": {},
    "maven-cache": {},
    "gradle-cache": {}
  }
}
