// Observe only external modules of the existing strict-locked runtime graph.
// The unified root injects :environment-ledger into messaging-support; that
// project output is not a client-library dependency and must not be resolved as
// a prebuilt JAR or copied into the external CI probe classpath.
import org.gradle.util.GradleVersion
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects {
    if (JavaVersion.current() != JavaVersion.VERSION_21 || GradleVersion.current().version != '8.10.2') {
        throw new GradleException('Environment acceptance requires actual Gradle8.10.2 JVM21')
    }
}
gradle.projectsEvaluated {
    def support = gradle.rootProject.project(':messaging-support')
    support.tasks.register('academyEnvironmentClasspath') {
        doLast {
            def external = support.configurations.runtimeClasspath.incoming.artifactView {
                componentFilter { identifier -> identifier instanceof ModuleComponentIdentifier }
            }
            def jars = external.files.files.sort { it.canonicalPath }
            if (jars.isEmpty() || jars.any { !it.isFile() || !it.name.endsWith('.jar') }) {
                throw new GradleException('Imported locked external client-library artifacts are incomplete')
            }
            println 'ACADEMY_CLASSPATH=' + jars.collect { it.canonicalPath }.join(File.pathSeparator)
        }
    }
}
