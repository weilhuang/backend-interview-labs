# Only this recovery subproject: distinguish internal Admin routing-cache evidence from API snapshots.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.log.org.apache.kafka.clients.admin.internals.AdminMetadataManager=debug
org.slf4j.simpleLogger.log.org.apache.kafka.clients.admin.KafkaAdminClient=debug
# Suppress complete client configuration dumps, including potentially sensitive settings.
org.slf4j.simpleLogger.log.org.apache.kafka.clients.admin.AdminClientConfig=warn
org.slf4j.simpleLogger.log.org.apache.kafka.clients.producer.ProducerConfig=warn
org.slf4j.simpleLogger.log.org.apache.kafka.clients.consumer.ConsumerConfig=warn
