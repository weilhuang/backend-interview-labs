apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: redis
    spec:
      selector:
        app: redis
      ports:
        - port: 6379
          targetPort: 6379
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: redis
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: redis
      template:
        metadata:
          labels:
            app: redis
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: redis
              image: ${REDIS_IMAGE}
              imagePullPolicy: Never
              command: [redis-server, /run/secrets/redis.conf]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              readinessProbe:
                tcpSocket:
                  port: 6379
                periodSeconds: 2
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: auth, mountPath: /run/secrets, readOnly: true}
          volumes:
            - name: data
              emptyDir:
                sizeLimit: 64Mi
            - name: auth
              secret:
                secretName: redis-auth
                defaultMode: 0440
                items:
                  - key: redis.conf
                    path: redis.conf
