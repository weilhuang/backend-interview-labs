<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C11 一杯茶订单实验室</title>
<style>body{font:18px/1.7 system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f7f5ed;color:#21382b}button,input{font:inherit;padding:.5rem;margin:.3rem}pre{white-space:pre-wrap;background:#fff;padding:1rem;border:1px solid #d4ddcf}small{display:block}</style>
<h1>一杯茶订单实验室</h1><p>这份前端已提供。先初始化10份库存，再观察重试同一个请求是否重复扣减。</p>
<button data-path="/live">进程存活</button><button data-path="/ready">业务就绪</button><button data-path="/downstream-check">检查下游</button><button data-path="/stock">查库存</button><button id="seed">幂等初始化</button>
<label>请求ID<input id="request" value="browser-order-1" maxlength="40"></label><label>份数<input id="quantity" type="number" min="1" max="10" value="2"></label><button id="order">提交同一订单</button>
<small>教学环境没有用户登录，只发布到本机回环地址。不要部署到公网。</small><pre id="result" aria-live="polite">等待你的第一个操作</pre>
<script>async function call(path,method='GET'){try{const r=await fetch(path,{method});document.querySelector('#result').textContent=`HTTP ${r.status}\n`+JSON.stringify(await r.json(),null,2)}catch(e){document.querySelector('#result').textContent='网络连接失败，请检查实验进程'} }document.querySelectorAll('[data-path]').forEach(b=>b.onclick=()=>call(b.dataset.path));document.querySelector('#seed').onclick=()=>call('/seed','POST');document.querySelector('#order').onclick=()=>call('/orders?request_id='+encodeURIComponent(document.querySelector('#request').value)+'&quantity='+encodeURIComponent(document.querySelector('#quantity').value),'POST')</script></html>
