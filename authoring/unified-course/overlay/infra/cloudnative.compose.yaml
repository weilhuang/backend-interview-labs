{
  "x-course": "C11 Docker→Compose→network。独立project与自有卷；唯一版本来自根shared/versions.env。",
  "services": {
    "cloudnative-api": {
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "networks": [
        "cloudnative"
      ],
      "build": {
        "context": "../materials/cloud-native",
        "dockerfile": "container/Dockerfile",
        "args": {
          "JAVA_BUILD_IMAGE": "${JAVA_BUILD_IMAGE}",
          "JAVA_RUNTIME_IMAGE": "${JAVA_RUNTIME_IMAGE}"
        }
      },
      "image": "${LAB_PROJECT_NAME}-cloudnative-api:local",
      "profiles": [
        "cloudnative"
      ],
      "user": "10001:10001",
      "read_only": true,
      "tmpfs": [
        "/tmp:size=32m,mode=1777"
      ],
      "mem_limit": "384m",
      "cpus": 0.75,
      "pids_limit": 96,
      "cap_drop": [
        "ALL"
      ],
      "stop_grace_period": "6s",
      "ports": [
        "127.0.0.1:${CLOUDNATIVE_HTTP_PORT}:8080"
      ],
      "environment": {
        "REDIS_HOST": "redis",
        "REDIS_PORT": "6379",
        "REDIS_PASSWORD": "${REDIS_PASSWORD}",
        "LAB_NAMESPACE": "${CLOUDNATIVE_NAMESPACE}",
        "HTTP_PORT": "8080",
        "WEB_ROOT": "/opt/app/web"
      },
      "depends_on": {
        "redis": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "java",
          "-cp",
          "/opt/app/classes",
          "labs.CloudNativeApp",
          "probe",
          "ready"
        ],
        "interval": "3s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s"
      }
    },
    "redis": {
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "networks": [
        "cloudnative"
      ],
      "image": "${REDIS_IMAGE}",
      "profiles": [
        "cloudnative"
      ],
      "mem_limit": "192m",
      "cpus": 0.5,
      "pids_limit": 64,
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD}"
      },
      "command": [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "96mb",
        "--maxmemory-policy",
        "noeviction"
      ],
      "volumes": [
        "cloudnative-redis-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"
        ],
        "interval": "3s",
        "timeout": "2s",
        "retries": 12,
        "start_period": "5s"
      }
    }
  },
  "networks": {
    "cloudnative": {}
  },
  "volumes": {
    "cloudnative-redis-data": {}
  }
}
