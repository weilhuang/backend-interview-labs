name: 分布式课程真实网络与持久化恢复验证
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'courses/distributed-systems/**'
      - 'infra/versions.env'
      - '.github/workflows/distributed.yml'
  push:
    branches: [main]
    paths:
      - 'courses/distributed-systems/**'
      - 'infra/versions.env'
      - '.github/workflows/distributed.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: courses/distributed-systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核实工具链与Docker守护进程
        run: |
          java -version
          docker version
          docker info
          chmod +x gradlew
          ./gradlew --version
      - name: 教案、公开解答与编码区合同
        run: |
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: 真实RPC、注册发现与全部单元
        run: ./gradlew --no-daemon --max-workers=1 test verificationClasspath --continue --console=plain
      - name: 真实MySQL、Kafka、Redis与XA恢复
        run: ./gradlew --no-daemon --max-workers=1 integrationTest --continue --console=plain -PdockerApiVersion=1.44
      - name: 学生起点与错误解验证
        run: python authoring/verify_variants.py --jdk "$JAVA_HOME"
      - name: 保存完整测试与负例证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 分布式课程验证报告
          path: |
            courses/distributed-systems/**/build/reports/tests/
            courses/distributed-systems/**/build/test-results/
            courses/distributed-systems/build/variants/
            courses/distributed-systems/authoring/*report.json
          retention-days: 7
