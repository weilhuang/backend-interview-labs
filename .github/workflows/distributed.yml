name: 分布式课程真实网络与持久化恢复验证
on:
  workflow_call:
permissions:
  contents: read

jobs:
  verify:
    name: real-distributed
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: courses/distributed-systems
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-distributed-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-distributed-${{ github.job }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核实工具链与Docker守护进程
        run: |
          java -version
          docker version
          docker info
          chmod +x gradlew
          ./gradlew --version
      - name: 教案、公开解答与编码区合同
        run: |
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: 真实RPC、注册发现与全部单元
        run: ./gradlew --no-daemon --no-build-cache --max-workers=1 test verificationClasspath --continue --console=plain
      - name: 真实MySQL、Kafka、Redis与XA恢复
        run: ./gradlew --no-daemon --no-build-cache --max-workers=1 integrationTest --continue --console=plain -PdockerApiVersion=1.44
      - name: 学生起点与错误解验证
        run: python authoring/verify_variants.py --jdk "$JAVA_HOME"
      - name: Academy源码夹具三阶段判题（contract）
        timeout-minutes: 35
        working-directory: ${{ github.workspace }}
        env:
          ACADEMY_COURSE: distributed-systems
          ACADEMY_KEY: distributed-systems
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python scripts/quality/academy_gate.py roundtrip \
            --course "$ACADEMY_COURSE" --suite contract \
            --java-home "$JAVA_HOME" --timeout 600 \
            --report "build/quality/$ACADEMY_KEY-roundtrip.json" \
            --work-dir "build/quality/$ACADEMY_KEY-roundtrip"
      - name: 保存完整测试与负例证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 分布式课程验证报告-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/quality/distributed-systems-roundtrip.json
            build/quality/distributed-systems-roundtrip/**/source-manifest.json
            build/quality/distributed-systems-roundtrip/**/*.log
            build/quality/distributed-systems-roundtrip/**/build/test-results/
            courses/distributed-systems/**/build/reports/tests/
            courses/distributed-systems/**/build/test-results/
            courses/distributed-systems/build/variants/
            courses/distributed-systems/authoring/*report.json
          retention-days: 7
          if-no-files-found: error
