name: 分布式课程真实网络与持久化恢复验证
on:
  workflow_call:
permissions:
  contents: read

jobs:
  verify:
    name: real-distributed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORG_GRADLE_PROJECT_dockerApiVersion: '1.44'
    defaults:
      run:
        working-directory: courses/distributed-systems
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-distributed-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-distributed-${{ github.job }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 核实工具链与Docker守护进程
        run: |
          java -version
          docker version
          docker info
          chmod +x gradlew
          ./gradlew --version
      - name: 教案、公开解答与编码区合同
        run: |
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: 默认完整判题、真实RPC与注册发现
        run: ./gradlew --no-daemon --no-build-cache --max-workers=1 test verificationClasspath --continue --console=plain
      - name: 真实MySQL、Kafka、Redis与XA恢复
        run: ./gradlew --no-daemon --no-build-cache --max-workers=1 integrationTest --continue --console=plain -PdockerApiVersion=1.44
      - name: 学生起点与错误解验证
        run: python authoring/verify_variants.py --jdk "$JAVA_HOME"
      - name: Academy源码夹具三阶段判题（contract）
        timeout-minutes: 35
        working-directory: ${{ github.workspace }}
        env:
          ACADEMY_COURSE: distributed-systems
          ACADEMY_KEY: distributed-systems
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python scripts/quality/academy_gate.py roundtrip \
            --course "$ACADEMY_COURSE" --suite contract \
            --java-home "$JAVA_HOME" --timeout 600 \
            --report "build/quality/$ACADEMY_KEY-roundtrip.json" \
            --work-dir "build/quality/$ACADEMY_KEY-roundtrip"
      - name: 默认Check入口的四个真实服务编码区与XA提交语义控制
        timeout-minutes: 16
        working-directory: ${{ github.workspace }}
        env:
          ORG_GRADLE_PROJECT_dockerApiVersion: '1.44'
        run: |
          python scripts/quality/distributed_integration_audit.py \
            --execute --xa-commit-controls --java-home "$JAVA_HOME" \
            --timeout 300 --total-timeout 900 \
            --work-dir build/quality/distributed-region-audit \
            --report build/quality/distributed-region-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/quality/distributed-region-audit.json').read_text())
          runtime = report['runtime']
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(report['grading_task'] == 'test', 'Audit must exercise the native default test task')
          require(report['status'] == report['docker_integration'] == runtime['status'] == 'PASS',
                  'Real-service execution did not pass; preparation is never acceptance')
          require(runtime['execution_requested'] is True and runtime['completed_runs'] == runtime['planned_runs'] == 8,
                  'Expected all eight sequential reference, region and semantic-control runs')
          require(report['limits']['gradle_process_seconds'] == 300 and report['limits']['total_execution_seconds'] == 900,
                  'Unexpected integration execution budget')
          expected = {'reference_runs': ('module', {'06-transactions', '07-outbox-cache'}),
                      'mutation_runs': ('region', {'DS-17', 'DS-19', 'DS-21', 'DS-22'}),
                      'semantic_control_runs': ('region', {'DS-17-omit-ra-commit', 'DS-17-omit-rb-commit'})}
          for section, (key, identities) in expected.items():
              rows = report[section]
              require(len(rows) == len(identities) and {row[key] for row in rows} == identities
                      and all(row['status'] == 'PASS' for row in rows), 'Incomplete or failed ' + section)
          PY
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        if: always()
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "distributed" \
            --output "$RUNNER_TEMP/ci-evidence-distributed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 保存完整测试与负例证据
        if: always() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 分布式课程验证报告-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-distributed-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
