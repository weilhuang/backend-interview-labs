name: 数据库与缓存课程真实服务检查
on:
  workflow_call:
permissions:
  contents: read

jobs:
  mysql:
    name: real-mysql
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: courses/data-storage/mysql-engineering
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-data-storage-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-data-storage-${{ github.job }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 校验课程与实际工具链
        run: |
          java -version
          javac -version
          docker version
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: 真正MySQL全部契约与故障集成
        run: ./gradlew --no-daemon --no-build-cache test
      - name: Academy源码夹具三阶段判题（integration）
        timeout-minutes: 35
        working-directory: ${{ github.workspace }}
        env:
          ACADEMY_COURSE: data-storage/mysql-engineering
          ACADEMY_KEY: mysql
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python scripts/quality/academy_gate.py roundtrip \
            --course "$ACADEMY_COURSE" --suite integration \
            --java-home "$JAVA_HOME" --timeout 600 \
            --report "build/quality/$ACADEMY_KEY-roundtrip.json" \
            --work-dir "build/quality/$ACADEMY_KEY-roundtrip" \
            --gradle-arg=-PdockerApiVersion=1.44
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        if: always()
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "mysql" \
            --output "$RUNNER_TEMP/ci-evidence-mysql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 保留全部可见测试报告
        if: always() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c06-mysql-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-mysql-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error

  redis:
    name: real-redis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: courses/data-storage/redis-engineering
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-data-storage-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-data-storage-${{ github.job }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 校验课程与实际工具链
        run: |
          java -version
          javac -version
          docker version
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: 真正Redis与MySQL全部契约和故障集成
        run: ./gradlew --no-daemon --no-build-cache test
      - name: Academy源码夹具三阶段判题（integration）
        timeout-minutes: 35
        working-directory: ${{ github.workspace }}
        env:
          ACADEMY_COURSE: data-storage/redis-engineering
          ACADEMY_KEY: redis
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python scripts/quality/academy_gate.py roundtrip \
            --course "$ACADEMY_COURSE" --suite integration \
            --java-home "$JAVA_HOME" --timeout 600 \
            --report "build/quality/$ACADEMY_KEY-roundtrip.json" \
            --work-dir "build/quality/$ACADEMY_KEY-roundtrip" \
            --gradle-arg=-PdockerApiVersion=1.44
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        if: always()
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "redis" \
            --output "$RUNNER_TEMP/ci-evidence-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 保留全部可见测试报告
        if: always() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c07-redis-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-redis-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
