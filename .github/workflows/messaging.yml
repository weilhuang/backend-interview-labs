name: 消息队列课程真实服务验证
on:
  workflow_call:
permissions:
  contents: read

jobs:
  verify:
    name: real-messaging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: courses/messaging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-messaging-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-messaging-${{ github.job }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 核对真实工具链与Docker
        run: |
          java -version
          javac -version
          docker version
          docker info
          chmod +x gradlew
          ./gradlew --version
      - name: 中文教案与占位检查
        run: |
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: RocketMQ首个真实路由就绪与收发冒烟
        timeout-minutes: 8
        run: ./gradlew --no-daemon --no-build-cache --max-workers=1 :rocketmq-01-routing:test -PwithDocker -PdockerApiVersion=1.44 --tests BrokerTest --console=plain
      - name: 串行真实broker和数据库测试
        run: ./gradlew --no-daemon --no-build-cache --max-workers=1 test -PwithDocker -PdockerApiVersion=1.44 --continue --console=plain
      - name: 学生起点与作者答案负例回归
        run: |
          python authoring/download_compile_dependencies.py
          python authoring/verify.py --jdk "$JAVA_HOME"
      - name: Academy源码夹具三阶段判题（contract）
        timeout-minutes: 35
        working-directory: ${{ github.workspace }}
        env:
          ACADEMY_COURSE: messaging
          ACADEMY_KEY: messaging
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python scripts/quality/academy_gate.py roundtrip \
            --course "$ACADEMY_COURSE" --suite contract \
            --java-home "$JAVA_HOME" --timeout 600 \
            --report "build/quality/$ACADEMY_KEY-roundtrip.json" \
            --work-dir "build/quality/$ACADEMY_KEY-roundtrip"
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        if: always()
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "messaging" \
            --output "$RUNNER_TEMP/ci-evidence-messaging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 保存可审查的测试证据
        if: always() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 消息课程真实验证报告-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-messaging-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
