name: 消息队列课程真实服务验证
on:
  pull_request:
    paths:
      - 'courses/messaging/**'
      - 'infra/versions.env'
      - '.github/workflows/messaging.yml'
  push:
    paths:
      - 'courses/messaging/**'
      - 'infra/versions.env'
      - '.github/workflows/messaging.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: courses/messaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核对真实工具链与Docker
        run: |
          java -version
          javac -version
          docker version
          docker info
          chmod +x gradlew
          ./gradlew --version
      - name: 中文教案与占位检查
        run: |
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
      - name: 串行真实broker和数据库测试
        run: ./gradlew --no-daemon --max-workers=1 test -PwithDocker -PdockerApiVersion=1.44 --continue --console=plain
      - name: 学生起点与作者答案负例回归
        run: |
          python authoring/download_compile_dependencies.py
          python authoring/verify.py --jdk "$JAVA_HOME"
      - name: 保存可审查的测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 消息课程真实验证报告
          path: |
            courses/messaging/**/build/reports/tests/
            courses/messaging/**/build/test-results/
            courses/messaging/build/verification/
          retention-days: 7
