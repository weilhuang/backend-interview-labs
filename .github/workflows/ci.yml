name: 课程分层验收
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  # 只有同一PR的新事件取代旧运行；不同PR、main、手动和发布运行互不取消。
  group: course-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    name: PR累计验收范围
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      java-pilot: ${{ steps.plan.outputs.java-pilot }}
      java-foundations: ${{ steps.plan.outputs.java-foundations }}
      java-advanced: ${{ steps.plan.outputs.java-advanced }}
      java-frameworks: ${{ steps.plan.outputs.java-frameworks }}
      data-storage: ${{ steps.plan.outputs.data-storage }}
      messaging: ${{ steps.plan.outputs.messaging }}
      distributed: ${{ steps.plan.outputs.distributed }}
      backend-capstone: ${{ steps.plan.outputs.backend-capstone }}
      lab-environment: ${{ steps.plan.outputs.lab-environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: plan
        name: 计算PR累计差异和共享依赖影响
        run: python scripts/ci/plan.py
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "ci-plan" \
            --output "$RUNNER_TEMP/ci-evidence-ci-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - if: success() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-ci-plan-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error

  static:
    name: 文档元数据与门禁自测
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/quality/requirements.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装固定静态检查依赖
        run: python -m pip install -r scripts/quality/requirements.txt
      - name: CI触发、失败证据与文档检查器回归
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: 可复现100任务课程与官方门禁静态回归（不冒充运行时验收）
        timeout-minutes: 3
        run: |
          python -m unittest discover -s scripts/academy/tests -v
          python scripts/build_unified_course.py --repo "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/public-course-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --report "$GITHUB_WORKSPACE/build/ci/public-course.json"
          python - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/academy')
          from gates import build_contract
          report=json.loads(Path('build/ci/public-course.json').read_text())
          root=Path(os.environ['RUNNER_TEMP'])/('public-course-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          contract=build_contract(root,report)
          assert contract['counts']==report['counts']
          PYTHON
      - name: 共享环境无Docker回归与台账漂移
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/sync_course_versions.py --check
          bash -n scripts/lab.sh
          for file in infra/rocketmq/*.sh; do bash -n "$file"; done
      - name: 新增课程必须显式接入真实验收
        run: python scripts/ci/plan.py --check-inventory
      - name: 校验本地文档目标与锚点
        run: python scripts/ci/validate_docs.py
      - name: Academy元数据静态门禁及其回归
        run: |
          python -m unittest discover -s scripts/quality/tests -v
          python scripts/quality/academy_gate.py metadata --report build/quality/academy-metadata.json
          python scripts/quality/academy_gate.py legacy-metadata --report build/quality/academy-legacy-metadata.json
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        if: always()
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "ci-static" \
            --output "$RUNNER_TEMP/ci-evidence-ci-static-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 保存轻量检查报告
        if: always() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-ci-static-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error

  java-pilot:
    name: java-pilot
    needs: [plan, static]
    if: needs.plan.outputs.java-pilot == 'true'
    uses: ./.github/workflows/java-pilot.yml

  java-foundations:
    name: java-foundations
    needs: [plan, static]
    if: needs.plan.outputs.java-foundations == 'true'
    uses: ./.github/workflows/java-foundations.yml

  java-advanced:
    name: java-advanced
    needs: [plan, static]
    if: needs.plan.outputs.java-advanced == 'true'
    uses: ./.github/workflows/java-advanced.yml

  java-frameworks:
    name: java-frameworks
    needs: [plan, static]
    if: needs.plan.outputs.java-frameworks == 'true'
    uses: ./.github/workflows/java-frameworks.yml

  data-storage:
    name: data-storage
    needs: [plan, static]
    if: needs.plan.outputs.data-storage == 'true'
    uses: ./.github/workflows/data-storage.yml

  messaging:
    name: messaging
    needs: [plan, static]
    if: needs.plan.outputs.messaging == 'true'
    uses: ./.github/workflows/messaging.yml

  distributed:
    name: distributed
    needs: [plan, static]
    if: needs.plan.outputs.distributed == 'true'
    uses: ./.github/workflows/distributed.yml

  backend-capstone:
    name: backend-capstone
    needs: [plan, static]
    if: needs.plan.outputs.backend-capstone == 'true'
    uses: ./.github/workflows/backend-capstone.yml

  lab-environment:
    name: lab-environment
    needs: [plan, static]
    if: needs.plan.outputs.lab-environment == 'true'
    uses: ./.github/workflows/lab-environment.yml

  result:
    name: CI验收总门禁
    if: always()
    needs: [plan, static, java-pilot, java-foundations, java-advanced, java-frameworks, data-storage, messaging, distributed, backend-capstone, lab-environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 区分真实通过、未运行和失败
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/finish.py
      - name: 收集有界脱敏CI证据
        id: collect_evidence
        env:
          EVIDENCE_JOB_STATUS: ${{ job.status }}
        if: always()
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/ci/collect_evidence.py --repo "$GITHUB_WORKSPACE" \
            --job-status "$EVIDENCE_JOB_STATUS" \
            --profile "ci-result" \
            --output "$RUNNER_TEMP/ci-evidence-ci-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: 保存包括失败状态的证据清单
        if: always() && steps.collect_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence-ci-result-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
