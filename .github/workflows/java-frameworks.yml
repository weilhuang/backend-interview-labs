name: Java框架真实构建与前端验收
on:
  workflow_call:
permissions:
  contents: read

jobs:
  verify:
    name: real-java-frameworks-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: courses/java-frameworks
    env:
      LAB_SHARED_VERSIONS: ${{ github.workspace }}/infra/versions.env
      GRADLE_USER_HOME: ${{ github.workspace }}/courses/java-frameworks/build/gradle-home
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            courses/java-frameworks/build/gradle-home/caches/modules-2
            courses/java-frameworks/build/gradle-home/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-java-frameworks-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-java-frameworks-${{ github.job }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 元数据与真实完整构建
        timeout-minutes: 10
        run: |
          java -version
          javac -version
          python -m pip install -r authoring/requirements.txt
          python authoring/validate_course.py
          ./gradlew --no-daemon --no-build-cache test verificationClasspath --console=plain
      - name: 真正MySQL事务集成
        timeout-minutes: 5
        run: ./gradlew --no-daemon --no-build-cache :03-transactions:integrationTest --console=plain
      - name: 所有可见调用方验证
        timeout-minutes: 5
        run: python authoring/verify_callers.py --jdk "$JAVA_HOME"
      - name: 正确性反例验证
        timeout-minutes: 12
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar -o "$RUNNER_TEMP/framework-junit.jar"
          echo "329bd10288875a74d04c9ca6b7c9889c265ddf87b21a9ea42a7f7392f391472a  $RUNNER_TEMP/framework-junit.jar" | sha256sum --check
          python authoring/verify_negative_cases.py --console "$RUNNER_TEMP/framework-junit.jar" --jdk "$JAVA_HOME"
      - name: Academy源码夹具三阶段判题（contract）
        timeout-minutes: 35
        working-directory: ${{ github.workspace }}
        env:
          ACADEMY_COURSE: java-frameworks
          ACADEMY_KEY: java-frameworks
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python scripts/quality/academy_gate.py roundtrip \
            --course "$ACADEMY_COURSE" --suite contract \
            --java-home "$JAVA_HOME" --timeout 600 \
            --report "build/quality/$ACADEMY_KEY-roundtrip.json" \
            --work-dir "build/quality/$ACADEMY_KEY-roundtrip"
      - name: 保存后端测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-backend-jdk21-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/quality/java-frameworks-roundtrip.json
            build/quality/java-frameworks-roundtrip/**/source-manifest.json
            build/quality/java-frameworks-roundtrip/**/*.log
            build/quality/java-frameworks-roundtrip/**/build/test-results/
            courses/java-frameworks/framework-course/**/build/reports/tests/
            courses/java-frameworks/framework-course/**/build/test-results/
            courses/java-frameworks/build/ui/
            courses/java-frameworks/build/server/
            courses/java-frameworks/build/callers/
            courses/java-frameworks/build/negative-verification/
            courses/java-frameworks/authoring/*report.json
            courses/java-frameworks/authoring/ui-verification.json
          retention-days: 7
          if-no-files-found: error

  ui:
    name: real-java-frameworks-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: courses/java-frameworks
    env:
      LAB_SHARED_VERSIONS: ${{ github.workspace }}/infra/versions.env
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 缓存依赖下载（不缓存测试结果或构建输出）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
            courses/java-frameworks/build/gradle-home/caches/modules-2
            courses/java-frameworks/build/gradle-home/wrapper
          key: ${{ runner.os }}-jdk21-deps-v1-java-frameworks-${{ github.job }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle.properties', '**/gradle.lockfile', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-jdk21-deps-v1-java-frameworks-${{ github.job }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装发行版中文字体以核验中文排版
        timeout-minutes: 3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match sans:lang=zh-cn
          java -version
          google-chrome --version
          node --version
          npm --version
          dpkg-query -W fonts-noto-cjk
      - name: 使用runner现有浏览器准备界面验证
        timeout-minutes: 5
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --prefix build/ui-tools --no-save playwright@1.62.1
          browser="$(command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo 'runner未提供浏览器，界面验收未运行'; exit 1; }
          echo "LAB_CHROMIUM=$browser" >> "$GITHUB_ENV"
          echo "NODE_PATH=$PWD/build/ui-tools/node_modules" >> "$GITHUB_ENV"
          mkdir -p build/ui
          ./scripts/course.sh start 02-http-contract
          ./scripts/course.sh check
      - name: 真实浏览器创建重试失败恢复与窄屏检查
        timeout-minutes: 3
        run: node authoring/verify_frontend.cjs
      - name: 停止本次课程服务
        timeout-minutes: 2
        if: always()
        run: ./scripts/course.sh stop
      - name: 保存真实界面截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-ui-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            courses/java-frameworks/build/ui/
            courses/java-frameworks/build/server/
            courses/java-frameworks/authoring/ui-verification.json
          retention-days: 7
          if-no-files-found: error
