name: Academy 初始化短诊断（非课程验收）
# 仅为待批准候选。此隔离分支不会触发现有 main 源码 CI 或 official/full 工作流。
# 若采用手动触发，须先由父任务决定如何让 workflow 在所选 ref 可用。
on:
  push:
    branches: [academy-diagnostic/startup-probe]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academy-startup-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  startup-diagnostic:
    name: 只采集启动边界，任何结果均不代表课程通过
    runs-on: ubuntu-24.04
    # 各步骤上限合计17分钟，外加1分钟调度余量；探针目标180秒，执行步骤4分钟取消兜底。
    # 这只是独立安装/诊断/上传外壳，不改变现有 full-validation 的任何预算。
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        timeout-minutes: 1
        with:
          distribution: temurin
          java-version: '21'
      - name: 复用既有固定 Python 依赖并运行纯 fixture 回归
        timeout-minutes: 1
        run: |
          python -m pip install -r scripts/quality/requirements.txt
          python -m unittest discover -s scripts/academy/tests -p test_startup_diagnostic.py -v
          bash -n scripts/academy/install_toolchain.sh
      - name: 仅预检已有工具和空间，不安装图形工具或修改系统
        timeout-minutes: 1
        run: |
          command -v Xvfb
          if command -v xwininfo >/dev/null; then echo '已有窗口标题工具'; else echo '窗口标题工具不可用，将如实记录'; fi
          python - <<'PY'
          import os, shutil, signal
          assert hasattr(os, 'pidfd_open') and hasattr(signal, 'pidfd_send_signal')
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 10*1024**3
          PY
      - name: 复用固定官方工具链安装器和 SHA256 校验
        timeout-minutes: 7
        run: |
          bash scripts/academy/install_toolchain.sh "$RUNNER_TEMP/academy-diag-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: 180秒协作式目标的启动诊断，4分钟步骤取消兜底，始终非验收
        timeout-minutes: 4
        run: |
          python scripts/academy/startup_diagnostic.py \
            --idea-home "$RUNNER_TEMP/academy-diag-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/idea" \
            --plugins-home "$RUNNER_TEMP/academy-diag-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/plugins" \
            --run-root "$RUNNER_TEMP/academy-startup-diagnostic-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --seconds 180
      - name: 只保存本次有界诊断证据一天，不上传 profile、环境、cookie 或课程 ZIP
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: academy-startup-diagnostic-NOT-ACCEPTANCE-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          path: ${{ runner.temp }}/academy-startup-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
